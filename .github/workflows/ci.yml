name: CI

# Every pull request: lint src, run the unit tests (including
# the protected fee tests), test the Edge Functions, build.
# Netlify builds and deploys the site itself; this workflow only checks.
# Process: engineering/policies/change-and-release.md in TrashDrop-Mobile-User-Domestic.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: 1
        run: npm ci --legacy-peer-deps

      # The whole of src must be lint-clean (the backlog reached 0 on
      # 2026-11-11). Warnings are allowed; errors fail the build.
      - name: Lint
        run: npx eslint src --ext .js,.jsx --quiet

      # Every package the site imports is a runtime dependency, so the
      # dependency audit (npm audit --omit=dev) covers it and no update can
      # remove it from under the build.
      - name: Runtime dependency check
        run: |
          node scripts/ci/check-runtime-deps.cjs --self-test
          node scripts/ci/check-runtime-deps.cjs src

      # Every source file is reachable from the app (index.html, the Vite
      # config or a test), and every export is used somewhere: no new copies,
      # debug panels or helpers nothing uses.
      # Files and exports it can't see being used are listed, with a reason,
      # in scripts/ci/unused-files-allowlist.txt.
      - name: Unused files check
        run: |
          node scripts/ci/check-unused-files.cjs --self-test
          node scripts/ci/check-unused-files.cjs

      # No personal data (email, phone, name, address) in console or logger
      # calls: a shared phone's console or a support screenshot can read it
      # (data protection controls). Exceptions with a reason in
      # scripts/ci/log-privacy-allowlist.txt.
      - name: Log privacy check
        run: |
          node scripts/ci/check-log-privacy.cjs --self-test
          node scripts/ci/check-log-privacy.cjs

      # Only TrashDrop domains we own (trashdrops.com) in shipped code:
      # trashdrop.app is someone else's (TD58, household repository)
      # trashdrop.com allowed until the owner confirms it is TrashDrop's (TD58)
      - name: Owned domains check
        run: |
          node scripts/ci/check-domains.cjs --self-test
          node scripts/ci/check-domains.cjs --allow trashdrop.com src supabase/functions index.html

      # Every supabase.rpc() call must name a database function that exists,
      # with parameter names it takes (production snapshot plus this
      # repository's migrations). Unit tests mock the database, so they can't.
      - name: Database call check
        run: |
          node scripts/ci/check-rpc-calls.mjs --self-test
          node scripts/ci/check-rpc-calls.mjs

      # Every Jest suite except scripts/ci/known-failing-tests.txt (may only
      # shrink; never the protected fee tests in pickupRequestUtils.test.js).
      - name: Unit tests
        run: npm run test:ci

      # The whole app and each file in scripts/ci/critical-files.txt, against the
      # floors in scripts/ci/coverage-floors.json (a floor may only go up)
      - name: Test coverage (floors)
        if: always()
        run: node scripts/ci/coverage-summary.mjs

      # vite directly, so the post-build pre-render (headless Chrome) doesn't
      # run in CI; Netlify still runs the full `npm run build`.
      - name: Build
        env:
          REACT_APP_SUPABASE_URL: https://ci-placeholder.supabase.co
          REACT_APP_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
        run: |
          node scripts/env-guard.cjs --self-test
          npx vite build

  edge-functions:
    name: Edge Function tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # loads the TypeScript handlers directly
      - name: Handler tests
        run: |
          shopt -s nullglob
          files=(supabase/functions/*/*.test.mjs)
          node --experimental-strip-types --test "${files[@]}"

  # The built site in a real browser (Chromium, laptop screen) against a fake
  # Supabase (browser-tests/fakeSupabase.mjs): the public home page, signing
  # in, and what an ordinary account and an admin may see (least privilege).
  # vite build only, as above (the pre-render isn't needed). Placeholder
  # Supabase settings: nothing reaches a real project. Report kept 14 days.
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: 1
        run: npm ci --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build with placeholder Supabase settings
        env:
          REACT_APP_SUPABASE_URL: https://ci-placeholder.supabase.co
          REACT_APP_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
        run: npx vite build

      - name: Browser tests
        env:
          CI: true
        run: npm run test:browser

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: |
            playwright-report
            test-results
          retention-days: 14
