# Labels added to pull requests from the files they change (actions/labeler).

protected-pricing:
  - changed-files:
      - any-glob-to-any-file:
          - CLAUDE.md
          - src/utils/pickupRequestUtils.js
          - src/utils/__tests__/pickupRequestUtils.test.js
          - supabase/migrations/20261107_fee_mismatch_pricing.sql

database:
  - changed-files:
      - any-glob-to-any-file:
          - supabase/migrations/**
          - supabase/diagnostics/**

edge-functions:
  - changed-files:
      - any-glob-to-any-file:
          - supabase/functions/**

product:admin:
  - changed-files:
      - any-glob-to-any-file:
          - src/**

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - scripts/ci/**
          - .gitleaks.toml

docs:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - '**/*.md'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - package.json
          - package-lock.json
