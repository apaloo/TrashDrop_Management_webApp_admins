[build]
  # Build the React app with legacy peer deps support
  # CI=false prevents ESLint warnings from being treated as errors
  command = "CI=false npm run build"
  publish = "build"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "16.20.2"  # Using an even more stable Node version compatible with React testing libraries
  NPM_FLAGS = "--legacy-peer-deps"
  CI = "true"  # This is used by npm install/prepare script for Husky skip
  # The Supabase project URL is public (it ships in the JS bundle), so a
  # SUPABASE_URL env var marked secret would otherwise fail every deploy.
  # Real secrets (service-role keys etc.) are still scanned.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

# Explicit content-type headers for static SEO files
# These ensure sitemap.xml and robots.txt are never caught by the SPA rewrite
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"
    X-Robots-Tag = "noindex"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    Cache-Control = "public, max-age=86400"

# Keep auth and admin routes out of search results.
# Keep in sync with NOINDEX_PATHS in src/App.js.
[[headers]]
  for = "/login"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/signup"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/forgot-password"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/reset-password"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/onboarding"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/dashboard"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/settings"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/request-pickup/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/bin-management/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/illegal-dumping/map"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/illegal-dumping/reports"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/illegal-dumping/history"
  [headers.values]
    X-Robots-Tag = "noindex"

# The old Accra page moved to the city landing page
[[redirects]]
  from = "/accra"
  to = "/waste-collection-accra"
  status = 301
  force = true

# App routes get the untouched app shell (the React router takes over).
# Public pages are pre-rendered static files (build/<route>/index.html, see
# scripts/prerender.js) and are served directly because static files win
# over non-forced rules. Keep in sync with the routes in src/App.js.
[[redirects]]
  from = "/login"
  to = "/app-shell.html"
  status = 200
[[redirects]]
  from = "/signup"
  to = "/app-shell.html"
  status = 200
[[redirects]]
  from = "/forgot-password"
  to = "/app-shell.html"
  status = 200
[[redirects]]
  from = "/reset-password"
  to = "/app-shell.html"
  status = 200
[[redirects]]
  from = "/onboarding"
  to = "/app-shell.html"
  status = 200
[[redirects]]
  from = "/dashboard"
  to = "/app-shell.html"
  status = 200
[[redirects]]
  from = "/settings"
  to = "/app-shell.html"
  status = 200
[[redirects]]
  from = "/request-pickup/*"
  to = "/app-shell.html"
  status = 200
[[redirects]]
  from = "/bin-management/*"
  to = "/app-shell.html"
  status = 200
[[redirects]]
  from = "/illegal-dumping/*"
  to = "/app-shell.html"
  status = 200
# Blog posts are public, so they get the indexable copy of the shell
[[redirects]]
  from = "/blog/*"
  to = "/blog-shell.html"
  status = 200

# Anything else is a real 404 (not a 200 with the homepage)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
