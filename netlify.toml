[build]
  # Build the React app with legacy peer deps support
  command = "npm run build"
  publish = "build"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "16.20.2"  # Using an even more stable Node version compatible with React testing libraries
  NPM_FLAGS = "--legacy-peer-deps"
  CI = "true"
  ESLINT_NO_DEV_ERRORS = "true"  # Prevent ESLint warnings from failing the build

# Handle Single Page Application routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
