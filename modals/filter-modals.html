<!-- Reports Filter Modal -->
<div id="reports-filter-modal" class="filter-modal fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-lg shadow-xl max-w-md w-full">
        <div class="p-4 border-b flex justify-between items-center">
            <h3 class="font-semibold text-lg">Filter Reports</h3>
            <button class="close-filter-modal text-gray-500 hover:text-gray-700">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <form id="reports-filter-form" class="p-4">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                <select id="filter-report-status" class="w-full border-gray-300 rounded-md shadow-sm">
                    <option value="">All Statuses</option>
                    <option value="pending">Pending</option>
                    <option value="in-progress">In Progress</option>
                    <option value="resolved">Resolved</option>
                    <option value="closed">Closed</option>
                </select>
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Priority</label>
                <select id="filter-report-priority" class="w-full border-gray-300 rounded-md shadow-sm">
                    <option value="">All Priorities</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                    <option value="critical">Critical</option>
                </select>
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Date Range</label>
                <input type="text" id="filter-report-date-range" class="date-range-picker w-full border-gray-300 rounded-md shadow-sm" placeholder="Select date range">
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Assigned To</label>
                <select id="filter-report-assigned-to" class="w-full border-gray-300 rounded-md shadow-sm">
                    <option value="">All Assignees</option>
                    <option value="unassigned">Unassigned</option>
                    <!-- Other assignees will be loaded dynamically -->
                </select>
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Location</label>
                <input type="text" id="filter-report-location" class="w-full border-gray-300 rounded-md shadow-sm" placeholder="Search by location">
            </div>
            
            <div class="flex justify-end space-x-2 mt-6">
                <button type="button" class="reset-filter-btn px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50" data-target="reports">Reset</button>
                <button type="button" class="apply-filter-btn px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700" data-target="reports">Apply Filters</button>
            </div>
        </form>
    </div>
</div>

<!-- Collectors Filter Modal -->

</div>
