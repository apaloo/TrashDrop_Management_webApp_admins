<!-- Appearance Settings Tab Content -->
<div id="appearance-settings" class="settings-tab-content hidden">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
        <!-- Theme Options -->
        <div class="card">
            <div class="p-4 border-b">
                <h3 class="font-semibold">Theme Options</h3>
            </div>
            <div class="p-4">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Color Theme</label>
                    <div class="grid grid-cols-5 gap-3">
                        <button class="theme-option w-full h-10 rounded-lg border-2 border-transparent hover:border-blue-500 focus:outline-none focus:border-blue-500" data-theme="blue" style="background-color: #3b82f6;"></button>
                        <button class="theme-option w-full h-10 rounded-lg border-2 border-transparent hover:border-blue-500 focus:outline-none focus:border-blue-500" data-theme="green" style="background-color: #10b981;"></button>
                        <button class="theme-option w-full h-10 rounded-lg border-2 border-transparent hover:border-blue-500 focus:outline-none focus:border-blue-500" data-theme="purple" style="background-color: #8b5cf6;"></button>
                        <button class="theme-option w-full h-10 rounded-lg border-2 border-transparent hover:border-blue-500 focus:outline-none focus:border-blue-500" data-theme="orange" style="background-color: #f59e0b;"></button>
                        <button class="theme-option w-full h-10 rounded-lg border-2 border-transparent hover:border-blue-500 focus:outline-none focus:border-blue-500" data-theme="red" style="background-color: #ef4444;"></button>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Dark Mode</label>
                    <div class="flex items-center">
                        <label class="inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="dark-mode-toggle" class="sr-only peer">
                            <div class="relative w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                            <span class="ml-3 text-sm font-medium text-gray-700" id="dark-mode-label">Off</span>
                        </label>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Sidebar Style</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button class="sidebar-style-option flex flex-col items-center p-3 border rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500" data-style="expanded">
                            <div class="w-full h-24 bg-gray-200 rounded-lg mb-2 flex">
                                <div class="w-1/3 h-full bg-gray-300 rounded-l-lg"></div>
                                <div class="w-2/3 h-full"></div>
                            </div>
                            <span class="text-sm">Expanded</span>
                        </button>
                        <button class="sidebar-style-option flex flex-col items-center p-3 border rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500" data-style="compact">
                            <div class="w-full h-24 bg-gray-200 rounded-lg mb-2 flex">
                                <div class="w-1/6 h-full bg-gray-300 rounded-l-lg"></div>
                                <div class="w-5/6 h-full"></div>
                            </div>
                            <span class="text-sm">Compact</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Layout Options -->
        <div class="card">
            <div class="p-4 border-b">
                <h3 class="font-semibold">Layout Options</h3>
            </div>
            <div class="p-4">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Card Style</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button class="card-style-option flex flex-col items-center p-3 border rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500" data-style="shadow">
                            <div class="w-full h-16 bg-white rounded-lg shadow-lg mb-2"></div>
                            <span class="text-sm">Shadow</span>
                        </button>
                        <button class="card-style-option flex flex-col items-center p-3 border rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500" data-style="border">
                            <div class="w-full h-16 bg-white rounded-lg border-2 border-gray-200 mb-2"></div>
                            <span class="text-sm">Border</span>
                        </button>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Font Size</label>
                    <div class="flex items-center">
                        <button class="font-size-btn px-3 py-1 text-xs border rounded-l-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500" data-size="small">Small</button>
                        <button class="font-size-btn px-3 py-1 text-sm border-t border-b border-r hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500" data-size="medium">Medium</button>
                        <button class="font-size-btn px-3 py-1 text-base border-t border-b border-r rounded-r-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500" data-size="large">Large</button>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Animation</label>
                    <div class="flex items-center">
                        <label class="inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="animation-toggle" class="sr-only peer" checked>
                            <div class="relative w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                            <span class="ml-3 text-sm font-medium text-gray-700" id="animation-label">Enabled</span>
                        </label>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Density</label>
                    <div class="flex items-center">
                        <button class="density-btn px-3 py-1 text-sm border rounded-l-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500" data-density="comfortable">Comfortable</button>
                        <button class="density-btn px-3 py-1 text-sm border-t border-b border-r hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500" data-density="compact">Compact</button>
                        <button class="density-btn px-3 py-1 text-sm border-t border-b border-r rounded-r-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500" data-density="dense">Dense</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Save Button -->
    <div class="flex justify-end">
        <button class="save-appearance-settings bg-blue-600 text-white px-4 py-2 rounded-lg">
            Save Changes
        </button>
    </div>
</div>
